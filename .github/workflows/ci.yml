name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    name: Swift tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Swift version
        run: swift --version

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi

      - name: Publish preflight
        run: script/publish_preflight.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test
