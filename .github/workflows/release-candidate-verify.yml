name: Release Candidate Verify

on:
  workflow_run:
    workflows: [Release Candidate]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  verify-artifact-provenance:
    name: Verify artifact provenance
    runs-on: macos-15
    timeout-minutes: 20
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    env:
      CANDIDATE_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release candidate source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download release candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          artifact_names="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name | test("^flowline-release-v[0-9]+(\\.[0-9]+){0,2}$")) | .name'
          )"
          artifact_count="$(printf '%s\n' "$artifact_names" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$artifact_count" != "1" ]]; then
            echo "Expected exactly one release candidate artifact for run $CANDIDATE_RUN_ID, found $artifact_count" >&2
            if [[ -n "$artifact_names" ]]; then
              printf '%s\n' "$artifact_names" >&2
            fi
            exit 2
          fi
          artifact_name="$artifact_names"
          artifact_version="${artifact_name#flowline-release-v}"
          echo "ARTIFACT_RELEASE_VERSION=$artifact_version" >> "$GITHUB_ENV"

          mkdir -p dist/release
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir dist/release

      - name: Resolve release archive
        shell: bash
        run: |
          set -euo pipefail

          release_archives="$(find dist/release -type f -name "Flowline-$ARTIFACT_RELEASE_VERSION.zip" -print | sort)"
          archive_count="$(printf '%s\n' "$release_archives" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$archive_count" != "1" ]]; then
            echo "Expected exactly one Flowline-$ARTIFACT_RELEASE_VERSION.zip release archive in downloaded artifact, found $archive_count" >&2
            if [[ -n "$release_archives" ]]; then
              printf '%s\n' "$release_archives" >&2
            fi
            exit 2
          fi
          release_archive="$release_archives"

          {
            echo "RELEASE_ARCHIVE=$release_archive"
            echo "RELEASE_TAG=v$ARTIFACT_RELEASE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Verify publish preflight with artifact provenance
        shell: bash
        run: >
          script/publish_preflight.sh
          --tag "$RELEASE_TAG"
          --archive "$RELEASE_ARCHIVE"
          --require-ci
          --require-artifact
